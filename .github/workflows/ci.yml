# Continuous integration for dsh-conflict-doctor.
#
# Two jobs because they answer different questions:
#   verify  — does the code build, and does the diagnosis still behave?
#   package — does the tarball ship exactly what a profile needs?
#
# A plugin whose `lib/` fails to compile still installs fine and then does
# nothing, so `build` here is not ceremony: it is the only automated evidence
# that the shipped artifact runs.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A push to a PR branch cancels the previous run for that branch; main builds
# are never cancelled, so a release always has a complete record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.19.0', '24.x']

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: build
        run: pnpm build

      - name: test
        run: node test/run.mjs

      - name: metadata gate
        run: node test/check-metadata.mjs

      - name: version gate
        run: node test/check-version.mjs

      - name: format gate
        run: pnpm format:check

      # CI runners have no DSH profile, so this exits 0 having compared nothing.
      # Its real job is whoever runs it locally, where a healthy real profile
      # must keep producing exactly the recorded finding set.
      - name: golden gate (skips when no profile exists)
        run: node test/check-golden.mjs

      # Host-dependent too, so it skips on CI. Still worth invoking: a budget
      # miss prints which read regressed and why that usually means an ORDER
      # change rather than slow hardware.
      - name: performance budget (skips when no host exists)
        run: node test/check-perf.mjs

      # A broken tarball is the one failure `pnpm test` cannot see: the suite
      # runs against src/, while a profile imports lib/.
      - name: tarball contents
        run: node test/check-tarball.mjs

  # Shallow check that the shipped artifact is loadable from a clean tree —
  # no DSH host available, so this asserts only that ESM resolution works.
  smoke:
    name: import smoke
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: the published entry point resolves and exports what a host calls
        run: node test/check-entry.mjs
